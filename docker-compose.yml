services:
  # Base image: system + Python dependencies (rarely changes)
  base:
    image: condenseit:base
    build:
      context: .
      dockerfile: docker-base/Dockerfile

  # App image: source code only (builds on top of base)
  app:
    image: condenseit:app
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - docker.cnb.cool/fjyaxax/condenseit:latest
        - type=local,src=/tmp/docker-cache
    depends_on:
      - base
    ports:
      - "8166:8899"
    env_file:
      - ../condenseit_data/.env
    environment:
      CONDENSEIT_CONFIG: /app/config.yaml
      CONDENSEIT_DATA_DIR: /app/data
      CONDENSEIT_FRONTEND_DIST: /app/frontend/dist
      TZ: CST
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../condenseit_data/config.yaml:/app/config.yaml:ro
      - ../condenseit_data/data:/app/data
      - pip_cache:/root/.cache/pip
      - frontend_node_modules:/app/frontend/node_modules
    command: ["condenseit", "serve", "--host", "0.0.0.0", "--port", "8899"]

volumes:
  pip_cache:
  frontend_node_modules:
