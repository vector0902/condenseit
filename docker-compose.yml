services:
  app:
    # image: ${CONDENSEIT_IMAGE:-ghcr.io/wildlifechorus/condenseit:${CONDENSEIT_IMAGE_TAG:-latest}}
    image: docker.cnb.cool/fjyaxax/condenseit:qw
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - docker.cnb.cool/fjyaxax/condenseit:latest
        - type=local,src=/tmp/docker-cache-qw
    # container_name: condenseit-app
    ports:
      - "8891:8899"
    env_file:
      # - .env
      - ../condenseit_data/.env
    environment:
      CONDENSEIT_CONFIG: /app/config.yaml
      CONDENSEIT_DATA_DIR: /app/data
      CONDENSEIT_FRONTEND_DIST: /app/frontend/dist
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # - ./config.yaml:/app/config.yaml:ro
      # - ./data:/app/data
      - ../condenseit_data/config.yaml:/app/config.yaml:ro
      - ../condenseit_data/data:/app/data
      - pip_cache:/root/.cache/pip
      - frontend_node_modules:/app/frontend/node_modules
    command: ["condenseit", "serve", "--host", "0.0.0.0", "--port", "8899"]

volumes:
  pip_cache:
  frontend_node_modules:
