# Web UI only. Ollama and digest runs stay on the host (Metal GPU).
# Shared ./data volume so native `condenseit run` appears in the UI.
services:
  app:

    # image: ${CONDENSEIT_IMAGE:-ghcr.io/wildlifechorus/condenseit:${CONDENSEIT_IMAGE_TAG:-latest}}
    image: docker.cnb.cool/fjyaxax/condenseit
    build: .

    ports:
      - "8899:8899"
    env_file:
      # - .env
      - ../condenseit_data/.env
    environment:
      CONDENSEIT_CONFIG: /app/config.yaml
      CONDENSEIT_DATA_DIR: /app/data
      CONDENSEIT_FRONTEND_DIST: /app/frontend/dist
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # - ./config.yaml:/app/config.yaml:ro
      # - ./data:/app/data
      - ../condenseit_data/config.yaml:/app/config.yaml:ro
      - ../condenseit_data/data:/app/data
    command: ["condenseit", "serve", "--host", "0.0.0.0", "--port", "8899"]

